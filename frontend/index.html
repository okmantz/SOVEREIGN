<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sovereign</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top">
    <div class="brand"><canvas id="logo" width="18" height="14" aria-hidden="true"></canvas><span>Sovereign</span></div>
    <button id="mission-bar" class="mission" type="button" aria-label="Open the money panel"></button>
    <div id="spend" class="muted"></div>
  </header>
  <div id="app">
    <nav id="rail" aria-label="Tools and panels"></nav>
    <section id="stage">
      <aside id="drawer" hidden aria-label="Panel"></aside>
      <div id="view">
        <canvas id="world" aria-label="Station floor plan"></canvas>
        <div id="hint"></div>
        <div id="welcome" hidden></div>
      </div>
    </section>
    <aside id="chat" aria-label="Chat with your agents"></aside>
  </div>
  <div id="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="avatar.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
  <script src="panels.js"></script>
  <script src="editor.js"></script>
</body>
</html>
