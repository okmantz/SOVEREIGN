<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sovereign</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Black until the app is ready, then the opening sequence (see intro.js). -->
  <div id="intro" role="status" aria-label="Sovereign is starting. Press any key to skip the introduction.">
    <div class="intro-line"><span id="intro-text"></span><i class="cursor" aria-hidden="true"></i></div>
    <div class="intro-skip">click or press any key to skip</div>
  </div>
  <header id="top">
    <div class="brand"><img class="logo" src="assets/emblem-96.png" alt=""><img class="wordmark" src="assets/wordmark.png" alt="Sovereign"></div>
    <button id="world-switch" class="world-switch" type="button" aria-haspopup="menu" aria-label="Switch world" style="display:none"></button>
    <button id="mission-bar" class="mission" type="button" aria-label="Open your goal and plan"></button>
    <div id="spend" class="muted"></div>
  </header>
  <div id="guide" class="guide" hidden></div>
  <div id="app">
    <nav id="rail" aria-label="Panels"></nav>
    <section id="stage">
      <aside id="drawer" hidden aria-label="Panel"></aside>
      <div id="view">
        <canvas id="world" aria-label="Station floor plan"></canvas>
        <div id="toolbar" role="toolbar" aria-label="Build tools"></div>
        <div id="hint"></div>
      </div>
    </section>
    <aside id="chat" aria-label="Chat with your agents"></aside>
  </div>
  <div id="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="intro.js"></script>
  <script src="avatar.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
  <script src="panels.js"></script>
  <script src="editor.js"></script>
  <script src="tutorial.js"></script>
</body>
</html>
