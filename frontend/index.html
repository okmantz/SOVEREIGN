<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sovereign</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top">
    <div class="brand"><canvas id="logo" width="18" height="14" aria-hidden="true"></canvas><span>Sovereign</span></div>
    <button id="mission-bar" class="mission" type="button" aria-label="Open the money panel"></button>
    <div id="spend" class="muted"></div>
  </header>
  <main>
    <nav id="tools" aria-label="Build tools"></nav>
    <section id="stage">
      <canvas id="world" width="960" height="640" aria-label="Station floor plan"></canvas>
      <div id="hint"></div>
      <div id="empty" hidden></div>
    </section>
    <aside id="side">
      <div id="tabs" role="tablist"></div>
      <div id="panel" role="tabpanel"></div>
    </aside>
  </main>
  <div id="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="avatar.js"></script>
  <script src="app.js"></script>
</body>
</html>
